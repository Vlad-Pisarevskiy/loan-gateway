# Prometheus локального стенда: опрос api и worker, правила алертов (раздел 14.3 спеки).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9100"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
